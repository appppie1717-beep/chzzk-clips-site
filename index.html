<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>드림이 클립</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <p class="eyebrow">DREAM CLIPS</p>
        <h1>드림이 클립</h1>
      </div>
    </header>

    <main>
      <nav class="category-bar" id="categoryBar" aria-label="클립 카테고리"></nav>

      <section class="clip-browser">
        <section class="category-grid" id="categoryGrid" aria-label="카테고리 목록"></section>
        <section class="clips-panel" id="clipsPanel">
          <div class="status-row">
            <p id="resultCount">카테고리를 선택하세요.</p>
          </div>
          <section class="clip-grid" id="clipGrid" aria-live="polite"></section>
        </section>
      </section>

      <section class="empty-state" id="emptyState" hidden>
        <h2>표시할 클립이 없습니다</h2>
        <p>카테고리나 검색어를 바꿔보세요.</p>
      </section>
    </main>

    <section class="player-modal" id="playerModal" hidden>
      <div class="player-backdrop" data-close-player></div>
      <article class="player-panel" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
        <div class="player-head">
          <div>
            <p class="player-kicker" id="playerCategory"></p>
            <h2 id="playerTitle">클립 재생</h2>
          </div>
          <button class="close-button" type="button" data-close-player>닫기</button>
        </div>
        <div class="player-frame-wrap">
          <video id="localPlayer" controls playsinline hidden></video>
          <iframe
            id="clipPlayer"
            title="치지직 클립 플레이어"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
            hidden
          ></iframe>
        </div>
        <p class="player-note">
          영상 파일이 등록된 클립은 사이트 안에서 바로 재생됩니다.
          치지직 링크만 있는 클립은 치지직에서 열어야 할 수 있습니다.
        </p>
        <a class="external-player-link" id="externalPlayerLink" target="_blank" rel="noreferrer">치지직에서 보기</a>
      </article>
    </section>

    <template id="clipCardTemplate">
      <article class="clip-card">
        <button class="clip-open" type="button">
          <img class="thumb" alt="" loading="lazy" />
        </button>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
